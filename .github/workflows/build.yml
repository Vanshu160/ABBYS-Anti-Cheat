name: Build Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileScanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          

      # Direct .apk download (no zip): a rolling "latest" release on every push to main.
      - name: Publish APK to the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ABBYS-Anti-Cheat.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ABBYS-Anti-Cheat.apk \
            --title "ABBYS Anti-Cheat (latest build)" \
            --notes "Debug-signed APK built from ${GITHUB_SHA::7}. Download the .apk and install it directly." \
            --target "$GITHUB_SHA"
