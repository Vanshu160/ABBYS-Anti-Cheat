<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABBYS Anti-Cheat | SS Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #090d16; color: #e6edf3; font-family: system-ui, -apple-system, sans-serif; padding: 20px; max-width: 720px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2937; padding-bottom: 16px; margin-bottom: 24px; }
    h2 { margin: 0; color: #38bdf8; letter-spacing: 1px; }
    .badge { background: #1e293b; color: #94a3b8; padding: 4px 10px; border-radius: 99px; font-size: 12px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #090d16; color: #fff; font-size: 15px; margin-bottom: 14px; }
    button { width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
    .pin-box { font-size: 36px; font-weight: 800; letter-spacing: 8px; color: #38bdf8; text-align: center; padding: 18px; background: #090d16; border: 1px dashed #0284c7; border-radius: 10px; margin-top: 16px; }
    .status { text-align: center; font-size: 14px; color: #f59e0b; margin-top: 12px; word-break: break-word; }
    .finding { background: #090d16; border-left: 4px solid #38bdf8; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
    .finding.HIGH { border-left-color: #ef4444; }
    .finding.WARN { border-left-color: #f59e0b; }
    .finding.CLEAN { border-left-color: #10b981; }
    .sev { font-weight: 700; font-size: 12px; }
    .detail { font-size: 13px; color: #9ca3af; margin-top: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <h2>🛡️ ABBYS ANTI-CHEAT</h2>
    <span class="badge">Mobile SS Panel</span>
  </header>

  <div class="card">
    <label for="projectId">Supabase Project ID (e.g. zdssel...):</label>
    <input type="text" id="projectId" placeholder="Paste short Project ID here" />

    <label for="apiKey">Supabase Publishable Key (sb_publishable_...):</label>
    <input type="text" id="apiKey" placeholder="Paste sb_publishable_... key here" />

    <label for="adminName">Admin Name or Discord ID:</label>
    <input type="text" id="adminName" placeholder="e.g. Vanshu.0" />

    <button id="genBtn" type="button">Generate 6-Digit SS PIN</button>

    <div id="pinDisplay" class="pin-box" style="display:none;"></div>
    <p id="statusText" class="status">Ready to generate PIN.</p>
  </div>

  <div id="reportContainer" class="card" style="display:none;">
    <h3 style="margin-top:0;">📋 Scan Results (<span id="reportPin"></span>)</h3>
    <div id="reportList"></div>
  </div>

  <script>
    const projInput = document.getElementById("projectId");
    const keyInput = document.getElementById("apiKey");
    const adminInput = document.getElementById("adminName");
    const statusEl = document.getElementById("statusText");
    const pinEl = document.getElementById("pinDisplay");

    projInput.value = localStorage.getItem("abbys_proj") || "";
    keyInput.value = localStorage.getItem("abbys_key") || "";
    adminInput.value = localStorage.getItem("abbys_admin") || "";

    document.getElementById("genBtn").addEventListener("click", async function() {
      const projectId = projInput.value.trim();
      const apiKey = keyInput.value.trim();
      const adminName = adminInput.value.trim() || "Admin";

      if (!projectId || !apiKey) {
        statusEl.innerText = "Please paste both your Project ID and Publishable Key above!";
        return;
      }

      localStorage.setItem("abbys_proj", projectId);
      localStorage.setItem("abbys_key", apiKey);
      localStorage.setItem("abbys_admin", adminName);

      const host = [projectId, "supabase", "co"].join(".");
      const baseUrl = window.location.protocol + "//" + host + "/rest/v1/scan_sessions";
      const pin = Math.floor(100000 + Math.random() * 900000).toString();

      statusEl.innerText = "Connecting to " + host + "...";

      try {
        const res = await fetch(baseUrl, {
          method: "POST",
          headers: {
            "apikey": apiKey,
            "Authorization": "Bearer " + apiKey,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({ pin: pin, admin_discord_id: adminName })
        });

        if (!res.ok) {
          const errText = await res.text();
          statusEl.innerText = "Database Error (" + res.status + "): " + errText;
          return;
        }

        pinEl.style.display = "block";
        pinEl.innerText = pin;
        statusEl.innerText = "Waiting for player to enter PIN in APK...";
        document.getElementById("reportContainer").style.display = "none";
        watchSession(baseUrl, apiKey, pin);
      } catch (err) {
        statusEl.innerText = "Network Error: " + err.message;
      }
    });

    function watchSession(baseUrl, apiKey, pin) {
      const timer = setInterval(async () => {
        try {
          const res = await fetch(baseUrl + "?pin=eq." + pin + "&select=*", {
            headers: {
              "apikey": apiKey,
              "Authorization": "Bearer " + apiKey
            }
          });
          const rows = await res.json();
          const data = Array.isArray(rows) ? rows : null;

          if (data && data.status === "COMPLETED" && data.report) {
            clearInterval(timer);
            statusEl.innerText = "✅ Scan Completed!";
            document.getElementById("reportPin").innerText = "PIN: " + pin;
            document.getElementById("reportContainer").style.display = "block";
            document.getElementById("reportList").innerHTML = data.report.map(item => `
              <div class="finding ${item.severity}">
                <div class="sev">[${item.severity}] ${item.title}</div>
                <div class="detail">${item.detail}</div>
              </div>
            `).join("");
          }
        } catch (e) {}
      }, 3000);
    }
  </script>
</body>
</html>
