<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABBYS Anti-Cheat | SS Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h2>ABBYS ANTI-CHEAT</h2>
    <span class="badge">Self-Hosted SS Panel</span>
  </header>

  <section class="card">
    <label for="adminName">Your name (optional)</label>
    <input type="text" id="adminName" placeholder="e.g. Vanshu" maxlength="40" />
    <button id="genBtn" type="button">Generate 6-digit SS PIN</button>

    <div id="pinWrap" class="hidden">
      <div id="pinDisplay" class="pin-box" aria-live="polite"></div>
      <div class="pin-meta">
        <span id="countdown"></span>
        <button id="copyPin" type="button" class="ghost">Copy PIN</button>
      </div>
    </div>
    <p id="statusText" class="status">Ready to generate PIN.</p>
  </section>

  <section id="reportContainer" class="card hidden">
    <div class="report-head">
      <h3>Scan results <span id="reportPin" class="muted"></span></h3>
      <button id="copyReport" type="button" class="ghost">Copy report</button>
    </div>
    <div id="summary" class="summary"></div>
    <div id="filters" class="filters" role="group" aria-label="Filter by severity">
      <button type="button" data-f="ALL" class="chip active">All</button>
      <button type="button" data-f="HIGH" class="chip">High</button>
      <button type="button" data-f="WARN" class="chip">Warn</button>
      <button type="button" data-f="INFO" class="chip">Info</button>
      <button type="button" data-f="CLEAN" class="chip">Clean</button>
    </div>
    <p class="note">Findings are indicators for review, not proof. Name matches in particular can be wrong.</p>
    <div id="reportList"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
